<h2>Idées recettes</h2>

<div class="recherche">
  <input #champ placeholder="Tape une recette : pasta, chicken…"
       (input)="taper(champ.value)" [value]="terme()" />
</div>

@if (chargement()) {
  <p class="info">Recherche en cours…</p>
} @else if (erreur()) {
  <p class="info">{{ erreur() }}</p>
} @else {
  <ul>
    @for (recette of resultats(); track recette.id) {
      <li>
        <img [src]="recette.image" [alt]="recette.name" />
        <a [routerLink]="['/recettes', recette.id]">{{ recette.name }}</a>
        <button (click)="ajouterIngredients(recette)">+ Ingrédients</button>
      </li>
    } @empty {
      <li class="info">Aucune recette pour l'instant. Essaie « pasta » ou « chicken ».</li>
    }
  </ul>
}
