<a routerLink="/recettes" class="retour">Retour aux recettes</a>

@if (recette(); as r) {
  <img [src]="r.image" [alt]="r.name" />
  <h2>{{ r.name }}</h2>
  <button (click)="ajouterIngredients(r)">Ajouter les ingrédients à ma liste</button>

  <h3>Ingrédients</h3>
  <ul>
    @for (ingredient of r.ingredients; track $index) {
      <li>{{ ingredient }}</li>
    }
  </ul>

  <h3>Préparation</h3>
  <ol>
    @for (etape of r.instructions; track $index) {
      <li>{{ etape }}</li>
    }
  </ol>
} @else {
  <p>Chargement…</p>
}
